# AI Deletion Audit Agent Configuration

models:
  # Primary Reasoning & Multimodal Engine (GPT-4o)
  # Used for multilingual request analysis, unstructured context parsing, and screenshot inspection
  llm_engine:
    enabled: false # Set to true when OPENAI_API_KEY is configured in code/.env
    model: "gpt-4o"
    temperature: 0.0
    timeout_seconds: 25
    retries: 3
    initial_backoff: 1.0

  # TypeSafe AI Jev Decision Model
  # Used TOGETHER WITH GPT-4o to evaluate structured probabilistic decisions and confidence calibration
  jev_decision_model:
    enabled: false # Set to true when TYPESAFE_JEV_API_KEY is configured in code/.env
    model: "typesafe-jev/jev-decision-v1"
    timeout_seconds: 15
    retries: 3
    threshold: 0.80

thresholds:
  intent_decision: 0.80
  grid_search_candidates: [0.50, 0.60, 0.65, 0.70, 0.80, 0.85, 0.90, 0.95]

paths:
  dataset_dir: "dataset"
  evidence_dir: "dataset/evidence"
  cache_dir: "cache"
  output_csv: "output.csv"
  evaluation_history: "code/evaluation/evaluation_history.jsonl"

orchestrator:
  max_guardrail_retries: 3
  stop_on_error: false
  log_level: "INFO"

caching:
  multimodal_cache_file: "cache/multimodal_cache.json"
  lazy_loading: true
