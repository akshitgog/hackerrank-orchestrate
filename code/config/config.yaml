# AI Deletion Audit Agent Configuration

models:
  # Intent Classifier: Natural language privacy request understanding
  intent_classifier:
    enabled: false # Set to true to use live LiteLLM provider
    model: "gemini/gemini-2.5-flash" # Options: gemini/gemini-2.5-flash, gpt-4o-mini, etc.
    temperature: 0.0
    timeout_seconds: 15
    retries: 3
    initial_backoff: 1.0

  # Multimodal Inspector: Visual inspection of PNG console screenshots on cache miss
  multimodal_inspector:
    enabled: false
    model: "gemini/gemini-2.5-flash"
    temperature: 0.0
    timeout_seconds: 25
    retries: 3

  # Decision Synthesizer: Complex conflict resolution
  decision_synthesizer:
    enabled: false
    model: "gemini/gemini-2.5-flash"
    temperature: 0.0
    timeout_seconds: 15
    retries: 3

thresholds:
  intent_decision: 0.80
  grid_search_candidates: [0.50, 0.60, 0.65, 0.70, 0.80, 0.85, 0.90, 0.95]

paths:
  dataset_dir: "dataset"
  evidence_dir: "dataset/evidence"
  cache_dir: "cache"
  output_csv: "output.csv"
  evaluation_history: "code/evaluation/evaluation_history.jsonl"

orchestrator:
  max_guardrail_retries: 3
  stop_on_error: false
  log_level: "INFO"

caching:
  multimodal_cache_file: "cache/multimodal_cache.json"
  lazy_loading: true
