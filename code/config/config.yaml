# AI Deletion Audit Agent Configuration

models:
  # Primary Reasoning & Multimodal VLM Engine
  # Fireworks AI (Llama-3.2-Vision / Qwen2.5-VL / Llama-3.3-70B), OpenAI (GPT-4o), or Gemini
  llm_engine:
    enabled: false # Set to true when API key is configured in code/.env
    # Fireworks AI VLM options:
    #   - "fireworks_ai/accounts/fireworks/models/llama-v3p2-11b-vision-instruct" (Fast VLM)
    #   - "fireworks_ai/accounts/fireworks/models/qwen2-vl-72b-instruct" (SOTA OCR & Screenshot VLM)
    #   - "fireworks_ai/accounts/fireworks/models/llama-v3p3-70b-instruct" (Fast Reasoning)
    # OpenAI: "gpt-4o"
    # Gemini: "gemini/gemini-2.5-flash"
    model: "fireworks_ai/accounts/fireworks/models/llama-v3p2-11b-vision-instruct"
    temperature: 0.0
    timeout_seconds: 25
    retries: 3
    initial_backoff: 1.0

  # TypeSafe AI Jev Decision Model
  # Used TOGETHER WITH VLM/LLM to evaluate calibrated structured probabilistic decisions
  jev_decision_model:
    enabled: false # Set to true when TYPESAFE_JEV_API_KEY is configured in code/.env
    model: "typesafe-jev/jev-decision-v1"
    timeout_seconds: 15
    retries: 3
    threshold: 0.80

thresholds:
  intent_decision: 0.80
  grid_search_candidates: [0.50, 0.60, 0.65, 0.70, 0.80, 0.85, 0.90, 0.95]

paths:
  dataset_dir: "dataset"
  evidence_dir: "dataset/evidence"
  cache_dir: "cache"
  output_csv: "output.csv"
  evaluation_history: "code/evaluation/evaluation_history.jsonl"

orchestrator:
  max_guardrail_retries: 3
  stop_on_error: false
  log_level: "INFO"

caching:
  multimodal_cache_file: "cache/multimodal_cache.json"
  lazy_loading: true
